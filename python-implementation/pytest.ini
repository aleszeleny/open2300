[pytest]
# Pytest configuration for PyOpen2300

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = tests

# Minimum Python version
minversion = 6.0

# Add options
addopts =
    # Verbose output
    -v
    # Show summary of all test outcomes
    -ra
    # Coverage report
    --cov=pyopen2300
    --cov-report=html
    --cov-report=term-missing
    # Show local variables in tracebacks
    --showlocals
    # Strict markers
    --strict-markers

# Markers for organizing tests
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Tests that take a long time to run
    hardware: Tests that require actual hardware
    mock: Tests using mocked hardware

# Coverage options
[coverage:run]
source = pyopen2300
omit = 
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov

