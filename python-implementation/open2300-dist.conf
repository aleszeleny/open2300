# open2300.conf - Python example configuration
#
# Copy this file to open2300.conf and edit the values for your station.
# The Python tools search, in order:
#   1. A config path supplied on the command line
#   2. ./open2300.conf
#   3. /usr/local/etc/open2300.conf
#   4. /etc/open2300.conf

# Logging: 0 = off, 1 = minimum, up to 3 = maximum
LOG_LEVEL 1

# Weather station connection
SERIAL_DEVICE /dev/ttyS0
TIMEZONE 1

# Units
WIND_SPEED m/s
TEMPERATURE C
RAIN mm
PRESSURE hPa

# Citizen Weather / APRS (optional)
CITIZEN_WEATHER_ID CW0000
CITIZEN_WEATHER_PASSCODE -1
CITIZEN_WEATHER_LATITUDE 5540.12N
CITIZEN_WEATHER_LONGITUDE 01224.60E
APRS_SERVER rotate.aprs.net 14580
APRS_SERVER first.aprs.net 14580
APRS_SERVER second.aprs.net 14580

# Weather Underground (optional)
WEATHER_UNDERGROUND_ID WUID
WEATHER_UNDERGROUND_PASSWORD WUPASSWORD

# PostgreSQL (required by pgsql2300; uncomment and edit before use)
# PGSQL_CONNECT hostaddr='127.0.0.1' dbname='open2300' user='postgres' password='pass'
# PGSQL_TABLE open2300.weather
# PGSQL_STATION open2300
# PGSQL_DAEMON_INTERVAL 300

# MQTT reporting (optional; required by mqtt2300)
# MQTT_HOST 127.0.0.1
# MQTT_PORT 1883
# MQTT_USERNAME
# MQTT_PASSWORD
# MQTT_BASE_TOPIC open2300
# MQTT_STATION open2300
# MQTT_QOS 1
# MQTT_RETAIN true
# MQTT_HA_DISCOVERY false
# MQTT_DISCOVERY_PREFIX homeassistant
